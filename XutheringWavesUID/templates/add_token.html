<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffe4ec">
  <title>添加 Token - XutheringWavesUID</title>
  <link rel="icon" href="https://web-static.kurobbs.com/resource/prod/icon.ico" type="image/x-icon">
  <style>
    :root {
      --verina-mint: #ffb7c5;
      --verina-deep: #e891a8;
      --verina-text: #7a3a4a;
      --verina-gold: #ffd700;
      --glass-bg: rgba(255, 255, 255, 0.85);
    }

    body,
    html {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    ::selection {
      background: rgba(255, 183, 197, 0.28);
      color: var(--verina-text);
    }

    .background-layer {
      position: fixed;
      inset: 0;
      background-image: url('https://xn--hlr389bc3tmof.cn/image/xiaoaibg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(3px);
      transform: scale(1.05);
      z-index: -10;
    }

    .background-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(255, 248, 220, 0.12) 0%,
        rgba(255, 200, 221, 0.06) 50%,
        rgba(255, 133, 162, 0.1) 100%
      );
      z-index: -9;
    }

    #nature-effects {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .login-container {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 2rem;
      border-radius: 24px;
      box-shadow:
        0 28px 64px -22px rgba(122, 58, 74, 0.32),
        0 8px 22px -12px rgba(122, 58, 74, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        0 0 70px rgba(255, 183, 197, 0.12);
      backdrop-filter: blur(18px) saturate(1.1);
      -webkit-backdrop-filter: blur(18px) saturate(1.1);
      width: 88%;
      max-width: 380px;
      margin: auto;
      position: relative;
      z-index: 10;
      animation: cardEnter 0.85s cubic-bezier(0.16, 1, 0.3, 1) both,
        floatContainer 6s ease-in-out 0.85s infinite;
    }

    .login-container::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 26px;
      background: linear-gradient(
        135deg,
        rgba(255, 215, 0, 0.25) 0%,
        rgba(255, 183, 197, 0.15) 50%,
        rgba(255, 200, 221, 0.25) 100%
      );
      z-index: -1;
      opacity: 0.5;
      animation: borderGlow 4s ease-in-out infinite;
    }

    .login-container:hover {
      animation-play-state: paused;
    }

    .login-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      animation: riseIn 0.6s ease 0.18s both;
    }

    .banner {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
      box-shadow: 0 6px 16px rgba(232, 145, 168, 0.32), 0 0 0 1px rgba(255, 255, 255, 0.6);
      position: relative;
      flex-shrink: 0;
    }

    .banner::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px dashed var(--verina-gold);
      animation: spinRing 25s linear infinite;
    }

    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .banner-text {
      flex: 1;
      padding-right: 12px;
      margin-left: 5px;
    }

    .welcome-text {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--verina-deep);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .logo-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--verina-text);
      opacity: 0.8;
    }

    .kurobbs-text {
      font-size: 0.75rem;
      font-weight: 600;
      color: #a87886;
      margin-top: 4px;
    }

    .input-group {
      margin-bottom: 1.25rem;
      animation: riseIn 0.55s ease 0.3s both;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--verina-text);
      font-weight: 700;
      font-size: 0.9rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.85rem;
      box-sizing: border-box;
      border: 1.5px solid rgba(255, 183, 197, 0.35);
      border-radius: 12px;
      font-size: 16px;
      background-color: rgba(255, 255, 255, 0.92);
      color: #333;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
    }

    input[type="text"]::placeholder {
      color: #9fb6aa;
    }

    input[type="text"]:hover {
      border-color: rgba(255, 183, 197, 0.6);
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--verina-deep);
      background-color: #fff;
      box-shadow: 0 0 0 4px rgba(255, 183, 197, 0.18);
    }

    .user-id-display {
      text-align: center;
      color: var(--verina-text);
      font-weight: 600;
      font-size: 0.85rem;
      line-height: 1.5;
      margin: 15px 0 5px;
      padding: 7px 10px;
      border: 1px solid rgba(255, 183, 197, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.6);
      animation: riseIn 0.55s ease 0.4s both;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      margin-top: 10px;
      background: linear-gradient(90deg, #ffb7c5, #ff9bb3, #ffd700, #ffb7c5);
      background-size: 300% 100%;
      animation: breathFlow 5s ease-in-out infinite, riseIn 0.55s ease 0.5s both;
      box-shadow: 0 8px 20px rgba(232, 145, 168, 0.25);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    button[type="submit"]::after {
      content: '';
      position: absolute;
      top: 0;
      left: -130%;
      width: 60%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      transition: left 0.6s ease;
      pointer-events: none;
    }

    button[type="submit"]:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(232, 145, 168, 0.32);
    }

    button[type="submit"]:hover:not(:disabled)::after {
      left: 140%;
    }

    button[type="submit"]:active:not(:disabled) {
      transform: translateY(0) scale(0.98);
    }

    button[type="submit"]:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
      animation: none;
      box-shadow: none;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background-color: #fff;
      margin: 40vh auto;
      padding: 30px 20px;
      border-radius: 20px;
      width: 80%;
      max-width: 320px;
      text-align: center;
      transform: scale(0.8);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
    }

    .modal.show {
      display: block;
      opacity: 1;
    }

    .modal.show .modal-content {
      transform: scale(1);
      opacity: 1;
    }

    .close {
      position: absolute;
      right: 15px;
      top: 10px;
      font-size: 28px;
      color: #ccc;
      cursor: pointer;
    }

    .redirect-button {
      margin-top: 20px;
      padding: 12px 35px;
      background: var(--verina-mint);
      color: white;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 183, 197, 0.4);
    }

    @keyframes borderGlow {
      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 0.6;
      }
    }

    @keyframes floatContainer {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(26px) scale(0.965);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes spinRing {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes breathFlow {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (max-width: 480px) {
      .login-container {
        width: 85%;
        padding: 1.5rem;
      }

      .welcome-text {
        font-size: 1.3rem;
      }

      .modal-content {
        margin-top: 35vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
<div class="background-layer"></div>
<div class="background-overlay"></div>
<div id="nature-effects"></div>

<div class="login-container">
  <div class="login-header">
    <div class="banner-text">
      <div class="welcome-text">添加 Token</div>
      <div class="logo-text">XutheringWavesUID</div>
      <div class="kurobbs-text">库街区</div>
    </div>
    <div class="banner">
      <img src="https://xn--hlr389bc3tmof.cn/image/xiaoai.png" alt="Banner">
    </div>
  </div>

  <form id="tokenForm">
    <div class="input-group">
      <label for="token">Token</label>
      <input type="text" id="token" name="token" required placeholder="请输入库街区 token" autocomplete="off">
    </div>
    <div id="userIdDisplay" class="user-id-display">你的账号 ID: {{ userId }}，请勿使用别人的链接</div>
    <button type="submit" id="submitBtn" disabled>立即添加</button>
  </form>
</div>

<div style="position:fixed;bottom:12px;left:0;right:0;z-index:999;font-size:12px;color:rgba(255,255,255,0.3);pointer-events:none;user-select:none;text-align:center;">Create By XutheringWavesUID &amp; 无敌美少女</div>

<div id="successModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2 style="color: #e891a8; margin-bottom: 10px;">提交成功</h2>
    <p style="color: #555; margin-bottom: 20px;">请回到聊天窗口查看结果</p>
    <p class="countdown" style="font-size: 13px; color: #888;">5秒后自动关闭</p>
    <button class="redirect-button">立即关闭</button>
  </div>
</div>

<script>
  const tokenInput = document.getElementById('token');
  const submitBtn = document.getElementById('submitBtn');
  const tokenForm = document.getElementById('tokenForm');
  const modal = document.getElementById('successModal');
  const closeBtn = modal.querySelector('.close');

  tokenInput.addEventListener('input', function () {
    submitBtn.disabled = this.value.trim() === '';
  });

  tokenForm.addEventListener('submit', function (e) {
    const data = {
      token: tokenInput.value.trim(),
      auth: '{{ auth }}',
    };

    e.preventDefault();
    submitBtn.disabled = true;

    postJson('{{ server_url }}/waves/add_token', data)
      .then(function (res) {
        if (res.success) {
          showSuccessModal();
        } else {
          alert('提交失败' + (res.msg ? ': ' + res.msg : '，请重试'));
          submitBtn.disabled = false;
        }
      })
      .catch(function () {
        alert('网络错误，请重试');
        submitBtn.disabled = false;
      });
  });

  function postJson(url, data) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    }).then(readJsonResponse);
  }

  function readJsonResponse(response) {
    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }
    return response.json();
  }

  function showSuccessModal() {
    const countdownElement = modal.querySelector('.countdown');
    const redirectButton = modal.querySelector('.redirect-button');
    let countdown = 5;

    modal.classList.add('show');
    setTimeout(function () {
      modal.querySelector('.modal-content').style.transform = 'scale(1)';
      modal.querySelector('.modal-content').style.opacity = '1';
    }, 10);

    function updateCountdown() {
      countdownElement.textContent = countdown + '秒后自动关闭';
      if (countdown <= 0) {
        clearInterval(timer);
        closeModal();
      }
      countdown -= 1;
    }

    const timer = setInterval(updateCountdown, 1000);

    redirectButton.addEventListener('click', function handleRedirect() {
      clearInterval(timer);
      redirectButton.removeEventListener('click', handleRedirect);
      closeModal();
    });

    closeBtn.addEventListener('click', function handleClose() {
      clearInterval(timer);
      closeBtn.removeEventListener('click', handleClose);
      closeModal();
    });
  }

  function closeModal() {
    modal.querySelector('.modal-content').style.transform = 'scale(0.8)';
    setTimeout(function () {
      modal.classList.remove('show');
    }, 300);
  }

  closeBtn.addEventListener('click', closeModal);

  window.addEventListener('click', function (event) {
    if (event.target === modal) {
      closeModal();
    }
  });
</script>
</body>
</html>
