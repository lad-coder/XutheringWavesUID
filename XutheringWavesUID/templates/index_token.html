<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffe4ec">
  <title>XutheringWavesUID 添加 Token</title>
  <link rel="icon" href="https://web-static.kurobbs.com/resource/prod/icon.ico" type="image/x-icon">
  <style>
    :root {
      --verina-mint: #ffb7c5;
      --verina-deep: #e891a8;
      --verina-text: #7a3a4a;
      --verina-gold: #ffd700;
      --glass-bg: rgba(255, 255, 255, 0.88);
      --panel-border: rgba(255, 183, 197, 0.24);
    }

    body, html {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 28px 0;
    }

    ::selection {
      background: rgba(255, 183, 197, 0.28);
      color: var(--verina-text);
    }

    .background-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://xn--hlr389bc3tmof.cn/image/xiaoaibg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(3px);
      transform: scale(1.05);
      z-index: -10;
    }

    .background-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(255, 248, 220, 0.12) 0%,
        rgba(255, 200, 221, 0.08) 52%,
        rgba(255, 133, 162, 0.12) 100%
      );
      z-index: -9;
    }

    #nature-effects {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .login-container {
      width: min(88%, 400px);
      padding: 2rem;
      border-radius: 24px;
      background-color: var(--glass-bg);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow:
        0 28px 64px -22px rgba(122, 58, 74, 0.32),
        0 8px 22px -12px rgba(122, 58, 74, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        0 0 70px rgba(255, 183, 197, 0.12);
      backdrop-filter: blur(18px) saturate(1.1);
      -webkit-backdrop-filter: blur(18px) saturate(1.1);
      position: relative;
      z-index: 10;
      animation: cardEnter 0.85s cubic-bezier(0.16, 1, 0.3, 1) both,
        floatContainer 6s ease-in-out 0.85s infinite;
    }

    .login-container::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 26px;
      background: linear-gradient(
        135deg,
        rgba(255, 215, 0, 0.25) 0%,
        rgba(255, 183, 197, 0.15) 50%,
        rgba(255, 200, 221, 0.25) 100%
      );
      z-index: -1;
      opacity: 0.5;
      animation: borderGlow 4s ease-in-out infinite;
    }

    @keyframes borderGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    @keyframes floatContainer {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(26px) scale(0.965); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    .login-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      animation: riseIn 0.6s ease 0.18s both;
    }

    .banner {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
      box-shadow: 0 6px 16px rgba(232, 145, 168, 0.32), 0 0 0 1px rgba(255, 255, 255, 0.6);
      position: relative;
      flex-shrink: 0;
    }

    .banner::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px dashed var(--verina-gold);
      animation: spinRing 25s linear infinite;
    }

    @keyframes spinRing {
      100% { transform: rotate(360deg); }
    }

    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .banner-text {
      flex: 1;
      padding-right: 12px;
      margin-left: 5px;
    }

    .welcome-text {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--verina-deep);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .logo-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--verina-text);
      opacity: 0.8;
    }

    .kurobbs-text {
      font-size: 0.75rem;
      font-weight: 600;
      color: #a87886;
      margin-top: 4px;
    }

    .input-group,
    .info-card,
    .submit-note {
      animation: riseIn 0.55s ease both;
    }

    .input-group { animation-delay: 0.3s; }
    .info-card { animation-delay: 0.42s; }
    .submit-note { animation-delay: 0.5s; }

    .input-group {
      margin-bottom: 1.1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--verina-text);
      font-weight: 700;
      font-size: 0.9rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.9rem;
      box-sizing: border-box;
      border: 1.5px solid rgba(255, 183, 197, 0.35);
      border-radius: 12px;
      font-size: 16px;
      background-color: rgba(255, 255, 255, 0.92);
      color: #333;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
    }

    input[type="text"]::placeholder {
      color: #9fb6aa;
    }

    input[type="text"]:hover {
      border-color: rgba(255, 183, 197, 0.6);
    }

    input[type="text"]:focus {
      outline: none;
      background-color: #fff;
      border-color: var(--verina-deep);
      box-shadow: 0 0 0 4px rgba(255, 183, 197, 0.18);
    }

    .input-tip {
      margin-top: 0.55rem;
      color: #9b6778;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .info-card {
      line-height: 1.6;
      margin-bottom: 0.9rem;
      padding: 0.85rem 0.95rem;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.64);
      color: var(--verina-text);
      font-size: 0.84rem;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .info-card strong {
      color: var(--verina-deep);
    }

    .user-id-display {
      text-align: center;
    }

    .submit-note {
      color: #a87886;
      font-size: 0.75rem;
      text-align: center;
      margin: 0.2rem 0 0.95rem;
      line-height: 1.5;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      background: linear-gradient(90deg, #ffb7c5, #ff9bb3, #ffd700, #ffb7c5);
      background-size: 300% 100%;
      animation: riseIn 0.55s ease 0.58s both, breathFlow 5s ease-in-out infinite;
      box-shadow: 0 8px 20px rgba(232, 145, 168, 0.25);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.3s ease, filter 0.2s ease;
    }

    button[type="submit"]::after {
      content: '';
      position: absolute;
      top: 0;
      left: -130%;
      width: 60%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      transition: left 0.6s ease;
      pointer-events: none;
    }

    @keyframes breathFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    button[type="submit"]:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(232, 145, 168, 0.32);
    }

    button[type="submit"]:hover:not(:disabled)::after {
      left: 140%;
    }

    button[type="submit"]:active:not(:disabled) {
      transform: translateY(0) scale(0.98);
    }

    button[type="submit"]:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
      animation: riseIn 0.55s ease 0.58s both;
      box-shadow: none;
    }

    .page-credit {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      z-index: 999;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.32);
      pointer-events: none;
      user-select: none;
      text-align: center;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background-color: rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background-color: #fff;
      margin: 40vh auto;
      padding: 30px 20px;
      border-radius: 20px;
      width: 80%;
      max-width: 320px;
      text-align: center;
      transform: scale(0.8);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .modal.show {
      display: block;
      opacity: 1;
    }

    .modal.show .modal-content {
      transform: scale(1);
      opacity: 1;
    }

    .close {
      position: absolute;
      right: 15px;
      top: 10px;
      font-size: 28px;
      color: #ccc;
      cursor: pointer;
    }

    .redirect-button {
      margin-top: 20px;
      padding: 12px 35px;
      background: var(--verina-mint);
      color: white;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 183, 197, 0.4);
    }

    @media (max-width: 480px) {
      body {
        justify-content: center;
        padding: 20px 0;
      }

      .login-container {
        width: 85%;
        padding: 1.5rem;
      }

      .welcome-text {
        font-size: 1.3rem;
      }

      .modal-content {
        margin-top: 35vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
<div class="background-layer"></div>
<div class="background-overlay"></div>
<div id="nature-effects"></div>

<div class="login-container">
  <div class="login-header">
    <div class="banner-text">
      <div class="welcome-text">添加 Token</div>
      <div class="logo-text">XutheringWavesUID</div>
      <div class="kurobbs-text">库街区</div>
    </div>
    <div class="banner">
      <img src="https://xn--hlr389bc3tmof.cn/image/xiaoai.png" alt="Banner">
    </div>
  </div>
  <form id="tokenForm">
    <div class="input-group">
      <label for="token">Token</label>
      <input type="text" id="token" name="token" required placeholder="请输入库街区 token" autocomplete="off">
      <div class="input-tip">推荐直接粘贴完整 token，避免手动输入时遗漏字符或空格。</div>
    </div>
    <div id="userIdDisplay" class="info-card user-id-display">
      你的账号 ID：<strong>{{ userId }}</strong><br>
      请勿提交他人的授权信息。
    </div>
    <div class="info-card">
      添加后将用于当前绑定流程校验。若 token 已失效，请重新获取后再提交。
    </div>
    <div class="submit-note">提交成功后请返回聊天窗口查看结果。</div>
    <button type="submit" id="submitBtn">立即添加</button>
  </form>
</div>

<div class="page-credit">Create By XutheringWavesUID</div>

<div id="successModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2 style="color: #e891a8; margin-bottom: 10px;">提交成功</h2>
    <p style="color: #555; margin-bottom: 20px;">请返回聊天窗口查看结果。</p>
    <p class="countdown" style="font-size: 13px; color: #888;">5 秒后自动关闭</p>
    <button class="redirect-button">立即关闭</button>
  </div>
</div>

<script>
  const tokenInput = document.getElementById('token');
  const submitBtn = document.getElementById('submitBtn');
  const tokenForm = document.getElementById('tokenForm');
  const modal = document.getElementById('successModal');
  const closeBtn = modal.querySelector('.close');

  tokenInput.addEventListener('input', refreshSubmitState);
  refreshSubmitState();

  tokenForm.addEventListener('submit', function (e) {
    const data = {
      token: tokenInput.value.trim(),
      auth: "{{ auth }}"
    };

    e.preventDefault();
    submitBtn.disabled = true;

    fetch('{{ server_url }}/waves/add_token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
      .then(readJsonResponse)
      .then(function (res) {
        if (res.success) {
          showSuccessModal();
        } else {
          alert('提交失败' + (res.msg ? ': ' + res.msg : '，请重试'));
          refreshSubmitState();
        }
      })
      .catch(function () {
        alert('网络错误，请重试');
        refreshSubmitState();
      });
  });

  function refreshSubmitState() {
    submitBtn.disabled = tokenInput.value.trim() === '';
  }

  function readJsonResponse(response) {
    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }
    return response.json();
  }

  function showSuccessModal() {
    const countdownElement = modal.querySelector('.countdown');
    const redirectButton = modal.querySelector('.redirect-button');
    let countdown = 5;

    modal.classList.add('show');
    setTimeout(function () {
      modal.querySelector('.modal-content').style.transform = 'scale(1)';
      modal.querySelector('.modal-content').style.opacity = '1';
    }, 10);

    function closeWithTimerCleanup(timer) {
      clearInterval(timer);
      closeModal();
    }

    function updateCountdown() {
      countdownElement.textContent = countdown + ' 秒后自动关闭';
      if (countdown <= 0) {
        closeWithTimerCleanup(timer);
      }
      countdown--;
    }

    updateCountdown();
    const timer = setInterval(updateCountdown, 1000);

    redirectButton.onclick = function () {
      closeWithTimerCleanup(timer);
    };

    modal.querySelector('.close').onclick = function () {
      closeWithTimerCleanup(timer);
    };
  }

  closeBtn.addEventListener('click', closeModal);

  function closeModal() {
    modal.querySelector('.modal-content').style.transform = 'scale(0.8)';
    setTimeout(function () {
      modal.classList.remove('show');
    }, 300);
  }

  window.addEventListener('click', function (event) {
    if (event.target === modal) {
      closeModal();
    }
  });
</script>
</body>
</html>
