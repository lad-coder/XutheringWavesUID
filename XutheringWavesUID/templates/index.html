<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffe4ec">
  <title>小爱 - 无敌美少女</title>
  <link rel="icon" href="https://web-static.kurobbs.com/resource/prod/icon.ico" type="image/x-icon">
  <style>
    /* === 核心配色变量 === */
    :root {
      --verina-mint: #ffb7c5;
      --verina-deep: #e891a8;
      --verina-text: #7a3a4a;
      --verina-gold: #ffd700;
      --verina-light-gold: #fff5f7;
      --verina-leaf: #ffc8dd;
      --verina-forest: #ff85a2;
      --glass-bg: rgba(255, 255, 255, 0.85);
    }

    body, html {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* === 背景层：原图 + 高斯模糊 === */
    .background-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://xn--hlr389bc3tmof.cn/image/xiaoaibg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(3px);
      transform: scale(1.05);
      z-index: -10;
    }

    /* === 背景叠加层 === */
    .background-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(255, 248, 220, 0.12) 0%,
        rgba(255, 200, 221, 0.06) 50%,
        rgba(255, 133, 162, 0.1) 100%
      );
      z-index: -9;
    }

    /* === 浮动元素层 === */
    #nature-effects {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    /* === 登录框 === */
    .login-container {
      background-color: var(--glass-bg);
      padding: 2rem;
      border-radius: 24px;
      box-shadow: 
        0 20px 50px rgba(122, 58, 74, 0.2),
        0 0 0 1px rgba(255, 255, 255, 1) inset,
        0 0 60px rgba(255, 183, 197, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      width: 88%;
      max-width: 380px;
      margin: auto;
      position: relative;
      z-index: 10;
      animation: floatContainer 6s ease-in-out infinite;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border-radius: 26px;
      background: linear-gradient(135deg, 
        rgba(255, 215, 0, 0.25) 0%, 
        rgba(255, 183, 197, 0.15) 50%, 
        rgba(255, 200, 221, 0.25) 100%
      );
      z-index: -1;
      opacity: 0.5;
      animation: borderGlow 4s ease-in-out infinite;
    }

    @keyframes borderGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    @keyframes floatContainer {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .login-container:hover {
      animation-play-state: paused;
    }

    .login-header {
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
      justify-content: space-between;
    }

    .banner {
      width: 72px; height: 72px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
      box-shadow: 0 4px 12px rgba(232, 145, 168, 0.3);
      position: relative;
      flex-shrink: 0;
    }

    .banner::after {
      content: '';
      position: absolute;
      top: -3px; left: -3px; right: -3px; bottom: -3px;
      border-radius: 50%;
      border: 2px dashed var(--verina-gold);
      animation: spinRing 25s linear infinite;
    }
    @keyframes spinRing { 100% { transform: rotate(360deg); } }

    .banner img { width: 100%; height: 100%; object-fit: cover; }
    .banner-text { flex: 1; padding-right: 12px; margin-left: 5px; }

    .welcome-text {
      font-size: 1.5rem; 
      font-weight: 800; 
      color: var(--verina-deep);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .logo-text {
      font-size: 0.95rem; 
      font-weight: 700; 
      color: var(--verina-text);
      opacity: 0.8;
    }
    .kurobbs-text {
      font-size: 0.75rem; 
      font-weight: 600; 
      color: #a87886;
      margin-top: 4px;
    }

    .input-group { margin-bottom: 1.25rem; }

    label {
      display: block; 
      margin-bottom: 0.5rem; 
      color: var(--verina-text);
      font-weight: 700;
      font-size: 0.9rem;
    }

    input[type="tel"], input[type="text"] {
      width: 100%; 
      padding: 0.85rem; 
      box-sizing: border-box;
      border: 2px solid rgba(255, 183, 197, 0.4);
      border-radius: 12px;
      font-size: 16px;
      background-color: rgba(255, 255, 255, 0.95);
      color: #333;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--verina-deep);
      box-shadow: 0 0 0 4px rgba(255, 183, 197, 0.2);
    }

    .verification-group { display: flex; gap: 0.6rem; }
    .verification-group input { flex-grow: 1; }

    button[type="submit"] {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      margin-top: 10px;
      background: linear-gradient(90deg, #ffb7c5, #ff9bb3, #ffd700, #ffb7c5);
      background-size: 300% 100%;
      animation: breathFlow 5s ease-in-out infinite;
      box-shadow: 0 8px 20px rgba(232, 145, 168, 0.25);
    }

    @keyframes breathFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    button[type="submit"]:active { transform: scale(0.98); }
    button[type="submit"]:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
      animation: none;
      box-shadow: none;
    }

    #getCodeBtn {
      width: auto;
      white-space: nowrap;
      padding: 0 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--verina-mint);
      background: #fff;
      color: var(--verina-deep);
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }
    #getCodeBtn:hover:not(:disabled) {
      background: var(--verina-mint);
      color: white;
    }

    .user-id-display {
      text-align: center;
      color: var(--verina-text);
      font-weight: 600;
      font-size: 0.85rem; 
      margin: 15px 0 5px 0;
      background: rgba(255,255,255,0.5);
      padding: 4px;
      border-radius: 8px;
    }

    /* === 弹窗样式 === */
    .modal {
      display: none; position: fixed; z-index: 2000; left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      opacity: 0; transition: opacity 0.3s ease;
      backdrop-filter: blur(5px);
    }
    .modal-content {
      background-color: #fff;
      margin: 40vh auto; 
      padding: 30px 20px;
      border-radius: 20px;
      width: 80%; max-width: 320px;
      text-align: center;
      transform: scale(0.8);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    }
    .modal.show { display: block; opacity: 1; }
    .modal.show .modal-content { transform: scale(1); opacity: 1; }
    
    .close { position: absolute; right: 15px; top: 10px; font-size: 28px; color: #ccc; cursor: pointer; }
    
    .redirect-button {
      margin-top: 20px; padding: 12px 35px;
      background: var(--verina-mint);
      color: white; border: none; border-radius: 25px;
      font-weight: bold; cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 183, 197, 0.4);
    }

    /* 移动端适配 */
    @media (max-width: 480px) {
      .login-container { width: 85%; padding: 1.5rem; }
      .welcome-text { font-size: 1.3rem; }
      .modal-content { margin-top: 35vh; }
    }

    /* ===== 视觉优化层：保持清新风格，提升质感 ===== */
    body, html {
      font-family: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    ::selection { background: rgba(255, 183, 197, 0.28); color: var(--verina-text); }

    /* 卡片：更柔润的多层投影、玻璃质感与入场动画 */
    .login-container {
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(18px) saturate(1.1);
      -webkit-backdrop-filter: blur(18px) saturate(1.1);
      box-shadow:
        0 28px 64px -22px rgba(122, 58, 74, 0.32),
        0 8px 22px -12px rgba(122, 58, 74, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        0 0 70px rgba(255, 183, 197, 0.12);
      animation: cardEnter 0.85s cubic-bezier(0.16, 1, 0.3, 1) both,
                 floatContainer 6s ease-in-out 0.85s infinite;
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(26px) scale(0.965); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 内容逐项淡入 */
    .login-header { animation: riseIn 0.6s ease 0.18s both; }
    #loginForm .input-group { animation: riseIn 0.55s ease 0.3s both; }
    #loginForm .input-group + .input-group { animation-delay: 0.4s; }
    #loginForm .user-id-display { animation: riseIn 0.55s ease 0.5s both; }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    /* 输入框：更细腻的描边 / 悬停 / 聚焦 */
    .login-container input {
      border-width: 1.5px;
      border-color: rgba(255, 183, 197, 0.35);
      background-color: rgba(255, 255, 255, 0.92);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
    }
    .login-container input::placeholder { color: #9fb6aa; }
    .login-container input:hover { border-color: rgba(255, 183, 197, 0.6); }
    .login-container input:focus {
      background-color: #fff;
      box-shadow: 0 0 0 4px rgba(255, 183, 197, 0.18);
    }

    /* 主按钮：悬停微抬升 + 高光扫过 */
    button[type="submit"] {
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.3s ease, filter 0.2s ease;
    }
    button[type="submit"]::after {
      content: '';
      position: absolute;
      top: 0;
      left: -130%;
      width: 60%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      transition: left 0.6s ease;
      pointer-events: none;
    }
    button[type="submit"]:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(232, 145, 168, 0.32);
    }
    button[type="submit"]:hover:not(:disabled)::after { left: 140%; }
    button[type="submit"]:active:not(:disabled) { transform: translateY(0) scale(0.98); }

    /* 头像描边光晕 */
    .banner { box-shadow: 0 6px 16px rgba(232, 145, 168, 0.32), 0 0 0 1px rgba(255, 255, 255, 0.6); }

    /* 备注条：更精致的描边 */
    .user-id-display {
      line-height: 1.5;
      padding: 7px 10px;
      border: 1px solid rgba(255, 183, 197, 0.18);
      background: rgba(255, 255, 255, 0.6);
    }

    /* 尊重「减少动态效果」系统偏好 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

  </style>
</head>
<body>

<!-- 背景层 -->
<div class="background-layer"></div>
<div class="background-overlay"></div>

<!-- 花草树叶漂浮层 -->
<div id="nature-effects"></div>

<div class="login-container">
  <div class="login-header">
    <div class="banner-text">
      <div class="welcome-text">欢迎登录</div>
      <div class="logo-text">无敌美少女</div>
      <div class="kurobbs-text">库街区</div>
    </div>
    <div class="banner">
      <img src="https://xn--hlr389bc3tmof.cn/image/xiaoai.png" alt="Banner">
    </div>
  </div>
  <form id="loginForm">
    <div class="input-group">
      <label for="phone">手机号</label>
      <input type="tel" id="phone" name="phone" required pattern="[0-9]{11}" placeholder="请输入11位手机号">
    </div>
    <div class="input-group">
      <label for="verificationCode">验证码</label>
      <div class="verification-group">
        <input type="text" id="verificationCode" name="verificationCode" required placeholder="请输入验证码">
        <button type="button" id="getCodeBtn" disabled>获取</button>
      </div>
    </div>
    <div id="userIdDisplay" class="user-id-display">你的账号 ID: {{ userId }}，请勿使用别人的链接</div>
    <div class="user-id-display">与库街区冲突，如希望同时登录库街区，<br><span>发送「aa如何同时登录」</span></div>
    <button type="submit" id="loginBtn">立即登录</button>
  </form>
</div>

<div style="position:fixed;bottom:12px;left:0;right:0;z-index:999;font-size:12px;color:rgba(255,255,255,0.3);pointer-events:none;user-select:none;text-align:center;">Create By XutheringWavesUID &amp; 无敌美少女</div>

<div id="successModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2 style="color: #e891a8; margin-bottom: 10px;">🌸 正在尝试登录</h2>
    <p style="color: #555; margin-bottom: 20px;">请返回查看结果！</p>
    <p class="countdown" style="font-size: 13px; color: #888;">3秒后自动跳转</p>
    <button class="redirect-button">立即前往</button>
  </div>
</div>

<script>
  // === 原始业务逻辑 ===
  const phoneInput = document.getElementById('phone');
  const verificationCodeInput = document.getElementById('verificationCode');
  const getCodeBtn = document.getElementById('getCodeBtn');
  const loginBtn = document.getElementById('loginBtn');
  const loginForm = document.getElementById('loginForm');
  const modal = document.getElementById('successModal');
  const closeBtn = modal.querySelector('.close');
  const loginContainer = document.querySelector('.login-container');
  const geetestScriptUrl = 'https://static.geetest.com/v4/gt4.js';
  let captchaReady = false;
  let showSmsCaptcha = null;
  let captchaInitToken = 0;

  phoneInput.addEventListener('input', function () {
    refreshButtonState();
  });

  verificationCodeInput.addEventListener('input', function () {
    refreshButtonState();
  });

  const headers = {
    "devcode": generateRandomString(),
    "source": "h5",
  };

  const captchaId = "ec4aa4174277d822d73f2442a165a2cd";
  const product = "bind";

  refreshButtonState();
  initCaptcha();

  loginForm.addEventListener('submit', function (e) {
    const data = {
      mobile: phoneInput.value,
      code: verificationCodeInput.value,
      auth: "{{ auth }}"
    }
    e.preventDefault();
    postJson('{{ server_url }}/waves/login', data)
      .then(res => res.success ? showSuccessModal() : alert('登录失败' + (res.msg ? res.msg : '，请重试')))
      .catch(() => alert('登录失败，请重试'));
  });

  getCodeBtn.onclick = function () {
    if (!showSmsCaptcha) {
      showCaptchaLoadError(initCaptcha);
      return;
    }
    showSmsCaptcha();
  };

  function initCaptcha() {
    const token = ++captchaInitToken;
    captchaReady = false;
    showSmsCaptcha = null;
    refreshButtonState();
    hideCaptchaLoadError();

    loadGeetestWithRetry()
      .then(function () {
        if (token !== captchaInitToken) return;
        if (typeof window.initGeetest4 !== 'function') {
          throw new Error('initGeetest4 unavailable');
        }
        window.initGeetest4({
          captchaId: captchaId,
          product: product,
        }, function (captcha) {
          if (token !== captchaInitToken) return;
          captcha.onReady(function () {
            captchaReady = true;
            showSmsCaptcha = function () {
              getCodeBtn.disabled = true;
              let countdown = 60;
              const originalText = getCodeBtn.textContent;
              captcha.showBox();
              const timer = setInterval(() => {
                getCodeBtn.textContent = `${countdown}s`;
                countdown--;
                if (countdown < 0) {
                  clearInterval(timer);
                  getCodeBtn.textContent = originalText;
                  refreshButtonState();
                  captcha.hideBox();
                }
              }, 1000);
            };
            refreshButtonState();
          }).onSuccess(function () {
            var result = captcha.getValidate();
            if (!result) {
              return alert('请完成验证');
            }
            result.captcha_id = captchaId;
            postForm('https://api.kurobbs.com/user/getSmsCodeForH5', {
              "mobile": phoneInput.value,
              "geeTestData": JSON.stringify(result)
            }, headers)
              .then(res => alert(res.success ? '验证码已发送' : '验证码发送失败 : ' + res.msg))
              .catch(() => alert('请求出错，请检查网络连接'));
          }).onError(function () {
            alert('请求出错，请检查网络连接');
          });
        });
      })
      .catch(function () {
        if (token !== captchaInitToken) return;
        showCaptchaLoadError(initCaptcha);
      });
  }

  function loadGeetestWithRetry() {
    return loadGeetestScript(false).catch(function () {
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          loadGeetestScript(true).then(resolve).catch(reject);
        }, 2000);
      });
    });
  }

  function loadGeetestScript(useCacheBust) {
    return new Promise(function (resolve, reject) {
      if (typeof window.initGeetest4 === 'function') {
        resolve();
        return;
      }
      document.querySelectorAll('script[data-gt4-loader]').forEach(function (script) {
        script.remove();
      });
      const script = document.createElement('script');
      script.src = geetestScriptUrl + (useCacheBust ? '?retry=' + Date.now() : '');
      script.async = true;
      script.dataset.gt4Loader = 'true';
      script.onload = function () {
        if (typeof window.initGeetest4 === 'function') {
          resolve();
        } else {
          reject(new Error('initGeetest4 unavailable'));
        }
      };
      script.onerror = function () {
        script.remove();
        reject(new Error('gt4 load failed'));
      };
      document.head.appendChild(script);
    });
  }

  function showCaptchaLoadError(retryHandler) {
    const panel = ensureCaptchaLoadError();
    const retryBtn = panel.querySelector('#captchaRetryBtn');
    retryBtn.onclick = retryHandler;
    panel.style.display = 'block';
    refreshButtonState();
  }

  function hideCaptchaLoadError() {
    const panel = document.getElementById('captchaLoadError');
    if (panel) panel.style.display = 'none';
  }

  function ensureCaptchaLoadError() {
    let panel = document.getElementById('captchaLoadError');
    if (!panel) {
      panel = document.createElement('div');
      panel.id = 'captchaLoadError';
      panel.className = 'user-id-display';
      panel.style.display = 'none';
      panel.innerHTML = '验证组件加载失败，请点击刷新重试<br><button type="button" id="captchaRetryBtn" class="redirect-button" style="margin-top:10px;padding:8px 18px;">刷新重试</button>';
      loginContainer.appendChild(panel);
    }
    return panel;
  }

  function refreshButtonState() {
    const phoneReady = phoneInput.value.length === 11;
    getCodeBtn.disabled = !phoneReady || !captchaReady;
    loginBtn.disabled = !phoneReady || verificationCodeInput.value === "";
  }

  function postJson(url, data) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    }).then(readJsonResponse);
  }

  function postForm(url, data, extraHeaders) {
    const formData = new URLSearchParams();
    Object.keys(data).forEach(function (key) {
      formData.append(key, data[key]);
    });
    return fetch(url, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' }, extraHeaders || {}),
      body: formData.toString(),
    }).then(readJsonResponse);
  }

  function readJsonResponse(response) {
    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }
    return response.json();
  }

  function showSuccessModal() {
    const homeHref = 'https://github.com/Loping151/XutheringWavesUID'
    const modal = document.getElementById('successModal');
    const countdownElement = modal.querySelector('.countdown');
    const redirectButton = modal.querySelector('.redirect-button');
    let countdown = 3;

    modal.classList.add('show');
    setTimeout(() => {
      modal.querySelector('.modal-content').style.transform = 'scale(1)';
      modal.querySelector('.modal-content').style.opacity = '1';
    }, 10);

    function updateCountdown() {
      countdownElement.textContent = `${countdown}秒后自动跳转`;
      if (countdown <= 0) {
        clearInterval(timer);
        window.location.href = homeHref;
      }
      countdown--;
    }
    const timer = setInterval(updateCountdown, 1000);

    redirectButton.addEventListener('click', () => {
      clearInterval(timer);
      window.location.href = homeHref;
    });
    modal.querySelector('.close').addEventListener('click', () => {
      clearInterval(timer);
      window.location.href = homeHref;
    });
  }

  closeBtn.addEventListener('click', closeModal);

  function closeModal() {
    modal.querySelector('.modal-content').style.transform = 'scale(0.8)';
    setTimeout(() => { modal.classList.remove('show'); }, 300);
  }

  window.addEventListener('click', function (event) {
    if (event.target === modal) { closeModal(); }
  });

  function generateRandomString() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    return Array(32).fill(0).map(() => chars.charAt(Math.floor(Math.random() * chars.length))).join('');
  }
</script>
