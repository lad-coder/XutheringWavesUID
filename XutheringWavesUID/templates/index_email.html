<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小爱 - 邮箱登录</title>
  <link rel="icon" href="https://web-static.kurobbs.com/resource/prod/icon.ico" type="image/x-icon">
  <!-- 极验（异步多源，失败不阻塞页面渲染） -->
  <script>
    (function () {
      var srcs = [
        'https://static.geetest.com/v4/gt4.js',
        'https://static.geevisit.com/v4/gt4.js'
      ];
      var done = false, i = 0, t;
      function fin() { if (done) return; done = true; window.dispatchEvent(new Event('geetestready')); }
      function next() {
        if (done) return;
        if (i >= srcs.length) { fin(); return; }
        var s = document.createElement('script');
        s.src = srcs[i++];
        s.onload = function () { window.initGeetest4 ? fin() : next(); };
        s.onerror = next;
        document.head.appendChild(s);
        clearTimeout(t); t = setTimeout(next, 3000);
      }
      next();
      setTimeout(fin, 8000);
    })();
  </script>
  <!-- GSAP -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('gsap-anim');
      var srcs = [
        'https://lib.baomitu.com/gsap/3.13.0/gsap.min.js',
        'https://cdn.staticfile.org/gsap/3.13.0/gsap.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js'
      ];
      var done = false, i = 0, timer;
      function reveal() { if (done) return; done = true; clearTimeout(timer); d.classList.remove('gsap-anim'); }
      function ready() { if (done) return; done = true; clearTimeout(timer); window.dispatchEvent(new Event('gsapready')); }
      function next() {
        if (done) return;
        if (i >= srcs.length) { reveal(); return; }
        var s = document.createElement('script');
        s.src = srcs[i++];
        s.onload = function () { window.gsap ? ready() : next(); };
        s.onerror = next;
        document.head.appendChild(s);
        clearTimeout(timer);
        timer = setTimeout(next, 2000);
      }
      next();
      setTimeout(reveal, 8000);
    })();
  </script>
  <style>
    :root {
      --verina-mint: #ffb7c5;
      --verina-deep: #e891a8;
      --verina-text: #7a3a4a;
      --verina-gold: #ffd700;
      --verina-leaf: #ffc8dd;
      --verina-forest: #ff85a2;
      --glass-bg: rgba(255, 255, 255, 0.9);
    }

    body, html {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'Microsoft YaHei', 'PingFang SC', 'HarmonyOS Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-image: url('https://xn--hlr389bc3tmof.cn/image/xiaoaibg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: inherit;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(8px);
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(255, 248, 220, 0.12) 0%, rgba(255, 200, 221, 0.06) 50%, rgba(255, 133, 162, 0.1) 100%);
      z-index: -1;
    }

    .login-container {
      background-color: var(--glass-bg);
      padding: 2rem;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(122, 58, 74, 0.2), 0 0 0 1px rgba(255, 255, 255, 1) inset, 0 0 60px rgba(255, 183, 197, 0.1);
      backdrop-filter: blur(18px) saturate(1.1);
      -webkit-backdrop-filter: blur(18px) saturate(1.1);
      width: 88%;
      max-width: 380px;
      margin: auto;
      position: relative;
      z-index: 10;
      animation: floatContainer 6s ease-in-out infinite;
    }

    .login-container:hover {
      animation-play-state: paused;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.25) 0%, rgba(255, 183, 197, 0.15) 50%, rgba(255, 200, 221, 0.25) 100%);
      z-index: -1;
      opacity: 0.5;
      animation: borderGlow 4s ease-in-out infinite;
    }

    @keyframes borderGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    @keyframes floatContainer {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .login-header {
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
      justify-content: space-between;
    }

    .banner {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
      box-shadow: 0 4px 12px rgba(232, 145, 168, 0.3);
      position: relative;
      flex-shrink: 0;
    }

    .banner::after {
      content: '';
      position: absolute;
      top: -3px; left: -3px; right: -3px; bottom: -3px;
      border-radius: 50%;
      border: 2px dashed var(--verina-gold);
      animation: spinRing 25s linear infinite;
    }
    @keyframes spinRing { 100% { transform: rotate(360deg); } }

    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .banner-text {
      flex: 1;
      padding-right: 12px;
      margin-left: 5px;
    }

    .welcome-text {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--verina-deep);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .logo-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--verina-text);
      opacity: 0.8;
    }

    .kurobbs-text {
      font-size: 0.75rem;
      font-weight: 600;
      color: #a87886;
      margin-top: 4px;
    }

    .input-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--verina-text);
      font-weight: 700;
      font-size: 0.9rem;
    }

    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 0.85rem;
      border: 1.5px solid rgba(255, 183, 197, 0.35);
      border-radius: 12px;
      box-sizing: border-box;
      font-size: 16px;
      background-color: rgba(255, 255, 255, 0.92);
      color: #333;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
    }

    input[type="email"]:focus, input[type="password"]:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--verina-deep);
      background-color: #fff;
      box-shadow: 0 0 0 4px rgba(255, 183, 197, 0.18);
    }

    .verification-group {
      display: flex;
      gap: 0.6rem;
    }

    .verification-group input {
      flex-grow: 1;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      margin-top: 10px;
      background: linear-gradient(90deg, #ffb7c5, #ff9bb3, #ffd700, #ffb7c5);
      background-size: 300% 100%;
      animation: breathFlow 5s ease-in-out infinite;
      box-shadow: 0 8px 20px rgba(232, 145, 168, 0.25);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button[type="submit"]::after {
      content: '';
      position: absolute;
      top: 0;
      left: -130%;
      width: 60%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      transition: left 0.6s ease;
      pointer-events: none;
    }

    button[type="submit"]:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(232, 145, 168, 0.32);
    }

    button[type="submit"]:hover:not(:disabled)::after { left: 140%; }

    button[type="submit"]:active:not(:disabled) { transform: translateY(0) scale(0.98); }

    button[type="submit"]:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
      animation: none;
      box-shadow: none;
    }

    @keyframes breathFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 移动端适配 */
    @media (max-width: 480px) {
      .login-container { width: 85%; padding: 1.5rem; }
      .welcome-text { font-size: 1.3rem; }
      .modal-content { margin-top: 35vh; }
    }

    /* ===== 入场动画 ===== */
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(26px) scale(0.965); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    .login-container {
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(18px) saturate(1.1);
      -webkit-backdrop-filter: blur(18px) saturate(1.1);
      box-shadow:
        0 28px 64px -22px rgba(122, 58, 74, 0.32),
        0 8px 22px -12px rgba(122, 58, 74, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        0 0 70px rgba(255, 183, 197, 0.12);
      animation: cardEnter 0.85s cubic-bezier(0.16, 1, 0.3, 1) both,
                 floatContainer 6s ease-in-out 0.85s infinite;
    }

    .login-header { animation: riseIn 0.6s ease 0.18s both; }
    #loginForm .input-group { animation: riseIn 0.55s ease 0.3s both; }
    #loginForm .input-group + .input-group { animation-delay: 0.4s; }
    #loginForm .user-id-display { animation: riseIn 0.55s ease 0.5s both; }

    /* 输入框细腻描边 */
    .login-container input {
      border-width: 1.5px;
      border-color: rgba(255, 183, 197, 0.35);
      background-color: rgba(255, 255, 255, 0.92);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
    }
    .login-container input::placeholder { color: #9fb6aa; }
    .login-container input:hover { border-color: rgba(255, 183, 197, 0.6); }
    .login-container input:focus {
      background-color: #fff;
      box-shadow: 0 0 0 4px rgba(255, 183, 197, 0.18);
    }

    /* 头像描边光晕 */
    .banner { box-shadow: 0 6px 16px rgba(232, 145, 168, 0.32), 0 0 0 1px rgba(255, 255, 255, 0.6); }

    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background-color: #fff;
      margin: 40vh auto;
      padding: 30px 20px;
      border-radius: 20px;
      width: 80%;
      max-width: 320px;
      text-align: center;
      transform: scale(0.8);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    }

    .modal.show {
      display: block;
      opacity: 1;
    }

    .modal.show .modal-content {
      transform: scale(1);
      opacity: 1;
    }

    .close {
      position: absolute;
      right: 15px;
      top: 10px;
      font-size: 28px;
      color: #ccc;
      cursor: pointer;
    }

    .user-id-display {
      text-align: center;
      color: var(--verina-text);
      font-weight: 600;
      font-size: 0.85rem;
      margin: 15px 0 5px 0;
      background: rgba(255,255,255,0.5);
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 183, 197, 0.18);
      line-height: 1.5;
    }

    .countdown {
      font-size: 13px;
      color: #888;
      margin-top: 10px;
    }

    .redirect-button {
      margin-top: 20px;
      padding: 12px 35px;
      background: var(--verina-mint);
      color: white;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 183, 197, 0.4);
      animation: none;
      width: auto;
    }

    ::selection { background: rgba(255, 183, 197, 0.28); color: var(--verina-text); }

    .region-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .region-card {
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border: 1px solid rgba(255, 183, 197, 0.18);
    }

    .region-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(232, 145, 168, 0.2);
    }

    .region-card .role-meta { display: flex; flex-direction: column; }
    .region-card .role-name { font-weight: 600; color: var(--verina-text); }
    .region-card .role-detail { color: #a87886; font-size: 0.8rem; }
    .region-card .lv-badge {
      background: var(--verina-mint);
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .region-hint {
      color: var(--verina-text);
      font-size: 0.82rem;
      line-height: 1.4;
      margin-bottom: 0.75rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    .gsap-anim .login-container { visibility: hidden; }
    .login-container.vx-introing,
    .login-container.vx-introing * { transition: none !important; }
    #vxToast {
      position: fixed; left: 50%; top: 20px;
      z-index: 3000; max-width: 86%; padding: 11px 18px;
      border-radius: 10px; font-size: 14px; font-weight: 600;
      line-height: 1.4; text-align: center; color: #1b2733;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      opacity: 0; visibility: hidden; pointer-events: none;
    }
    #vxToast.is-error { color: #fff; background: #d9534f; }
  </style>
</head>
<body>
<div class="login-container">
  <div class="login-header">
    <div class="banner-text">
      <div class="welcome-text">欢迎登录</div>
      <div class="logo-text">XutheringWavesUID</div>
      <div class="kurobbs-text">邮箱登录</div>
    </div>
    <div class="banner">
      <img src="https://xn--hlr389bc3tmof.cn/image/xiaoai.png" alt="Banner">
    </div>
  </div>
  <form id="loginForm">
    <div class="input-group">
      <label for="email">邮箱</label>
      <input type="email" id="email" name="email" required autocomplete="username" placeholder="请输入登录邮箱">
    </div>
    <div class="input-group">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="请输入账号密码">
    </div>
    <div id="userIdDisplay" class="user-id-display">你的账号: {{ userId }} 请勿使用别人的链接</div>
    <button type="submit" id="loginBtn" disabled>登录</button>
  </form>

  <div id="regionPanel" style="display:none;">
    <div class="region-hint">检测到该账号下有多个区服角色，请选择要绑定的角色：</div>
    <div id="regionList" class="region-list"></div>
  </div>
</div>

<div style="position:fixed;bottom:12px;left:0;right:0;z-index:999;font-size:12px;color:rgba(255,255,255,0.3);pointer-events:none;user-select:none;text-align:center;">Create By XutheringWavesUID &amp; 无敌美少女</div>

<div id="successModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2 style="color: #e891a8; margin-bottom: 10px;">🌸 登录成功</h2>
    <p>欢迎回来！</p>
    <p class="countdown">5秒后自动跳转到首页</p>
    <button class="redirect-button">立即跳转</button>
  </div>
</div>

<script>
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const loginForm = document.getElementById('loginForm');
  const regionPanel = document.getElementById('regionPanel');
  const regionList = document.getElementById('regionList');
  const modal = document.getElementById('successModal');
  const closeBtn = modal.querySelector('.close');

  let geetestFailed = false;

  function ajax(opts) {
    var headers = {}, body = opts.data;
    if (opts.data && typeof opts.data === 'object') {
      headers['Content-Type'] = 'application/x-www-form-urlencoded; charset=UTF-8';
      body = Object.keys(opts.data).map(function (k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(opts.data[k]);
      }).join('&');
    } else if (opts.contentType) {
      headers['Content-Type'] = opts.contentType;
    }
    if (opts.headers) for (var k in opts.headers) headers[k] = opts.headers[k];
    fetch(opts.url, { method: opts.type || 'GET', headers: headers, body: body })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (res) { if (opts.success) opts.success(res); })
      .catch(function () { if (opts.error) opts.error(); });
  }

  function whenGeetestReady(config, cb) {
    function go() {
      if (!window.initGeetest4) { geetestFailed = true; return; }
      window.initGeetest4(config, cb);
    }
    if (window.initGeetest4) go();
    else window.addEventListener('geetestready', go, { once: true });
  }

  const captchaId = "1f4565ff7acc97b1a2fc97b921743aa4";
  let captchaInstance = null;

  function refreshLoginButton() {
    loginBtn.disabled = !(emailInput.value && passwordInput.value);
  }

  emailInput.addEventListener('input', refreshLoginButton);
  passwordInput.addEventListener('input', refreshLoginButton);

  whenGeetestReady({
    captchaId: captchaId,
    product: "bind",
    language: "zh-Hans",
  }, function (captcha) {
    captchaInstance = captcha;
    captcha.onSuccess(function () {
      const result = captcha.getValidate();
      if (!result) return;
      submitLogin({
        captcha_output: result.captcha_output,
        gen_time: result.gen_time,
        lot_number: result.lot_number,
        pass_token: result.pass_token,
      });
    }).onError(function () {
      alert('验证出错，请重试');
    });
  });

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (geetestFailed) {
      return alert('验证服务加载失败，请刷新页面或更换网络后重试');
    }
    if (!captchaInstance) {
      return alert('滑块组件还在加载，请稍后再试');
    }
    captchaInstance.showCaptcha();
  });

  function submitLogin(captchaResult) {
    const data = {
      auth: "{{ auth }}",
      email: emailInput.value,
      password: passwordInput.value,
      captcha: captchaResult,
    };
    loginBtn.disabled = true;
    loginBtn.textContent = '登录中…';
    ajax({
      url: '{{ server_url }}/waves/l/login',
      type: 'POST',
      data: JSON.stringify(data),
      contentType: 'application/json',
      success: function (res) {
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
        if (!res.success) {
          alert('登录失败' + (res.msg ? '：' + res.msg : '，请重试'));
          return;
        }
        if (res.bound) {
          showSuccessModal();
          return;
        }
        if (res.regions && res.regions.length > 0) {
          showRegionPicker(res.regions);
        } else {
          alert('未查询到任何角色，请确认账号下是否有鸣潮角色');
        }
      },
      error: function () {
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
        alert('登录请求失败，请稍后再试');
      }
    });
  }

  function showRegionPicker(regions) {
    loginForm.style.display = 'none';
    regionPanel.style.display = 'block';
    regionList.innerHTML = '';
    regions.forEach(function (r) {
      const card = document.createElement('div');
      card.className = 'region-card';
      card.innerHTML =
        '<div class="role-meta">' +
        '<span class="role-name">' + escapeHtml(r.role_name || '未命名') + '</span>' +
        '<span class="role-detail">' + escapeHtml(r.region) + ' · UID ' + escapeHtml(r.role_id) + '</span>' +
        '</div>' +
        '<span class="lv-badge">Lv.' + (r.level || 0) + '</span>';
      card.addEventListener('click', function () {
        bindRegion(r.role_id, r.region, card);
      });
      regionList.appendChild(card);
    });
  }

  function bindRegion(roleId, region, cardEl) {
    Array.from(regionList.children).forEach(function (c) { c.style.pointerEvents = 'none'; });
    cardEl.style.opacity = '0.6';
    ajax({
      url: '{{ server_url }}/waves/l/bind',
      type: 'POST',
      data: JSON.stringify({ auth: "{{ auth }}", role_id: roleId, region: region }),
      contentType: 'application/json',
      success: function (res) {
        if (!res.success) {
          alert('绑定失败' + (res.msg ? '：' + res.msg : '，请重试'));
          Array.from(regionList.children).forEach(function (c) { c.style.pointerEvents = 'auto'; });
          cardEl.style.opacity = '1';
          return;
        }
        showSuccessModal();
      },
      error: function () {
        alert('绑定请求失败，请稍后再试');
        Array.from(regionList.children).forEach(function (c) { c.style.pointerEvents = 'auto'; });
        cardEl.style.opacity = '1';
      }
    });
  }

  function showSuccessModal() {
    const homeHref = 'https://github.com/Loping151/XutheringWavesUID';
    const countdownElement = modal.querySelector('.countdown');
    const redirectButton = modal.querySelector('.redirect-button');
    let countdown = 5;

    modal.classList.add('show');
    setTimeout(() => {
      modal.querySelector('.modal-content').style.transform = 'scale(1)';
      modal.querySelector('.modal-content').style.opacity = '1';
    }, 10);

    function updateCountdown() {
      countdownElement.textContent = `${countdown}秒后自动跳转到首页`;
      if (countdown <= 0) {
        clearInterval(timer);
        window.location.href = homeHref;
      }
      countdown--;
    }

    const timer = setInterval(updateCountdown, 1000);

    redirectButton.addEventListener('click', () => {
      clearInterval(timer);
      window.location.href = homeHref;
    });

    modal.querySelector('.close').addEventListener('click', () => {
      clearInterval(timer);
      window.location.href = homeHref;
    });
  }

  closeBtn.addEventListener('click', closeModal);

  function closeModal() {
    modal.querySelector('.modal-content').style.transform = 'scale(0.7)';
    setTimeout(() => {
      modal.classList.remove('show');
    }, 300);
  }

  window.addEventListener('click', function (event) {
    if (event.target === modal) {
      closeModal();
    }
  });

  function loadBackgroundImage() {
    const img = new Image();
    img.onload = function () {
      document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)), url(${img.src})`;
      document.body.classList.add('bg-loaded');
    };
    img.src = 'https://prod-alicdn-community.kurobbs.com/forum/465dcb694966492aba4d4982c47f0e8520240914.jpg';
  }

  window.addEventListener('load', loadBackgroundImage);

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
</script>

<script>
  // GSAP 动效层
  function vxInit() {
    if (!window.gsap) return;
    var card = document.querySelector('.login-container');
    if (!card) return;
    var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var toast = document.createElement('div');
    toast.id = 'vxToast';
    document.body.appendChild(toast);
    gsap.set(toast, { xPercent: -50 });
    var toastTl;
    function vxToast(msg) {
      var s = String(msg == null ? '' : msg);
      var isErr = /失败|出错|错误|请完成|稍后|不存在|超时|异常/.test(s);
      toast.textContent = s;
      toast.className = isErr ? 'is-error' : '';
      if (toastTl) toastTl.kill();
      gsap.killTweensOf(toast);
      toastTl = gsap.timeline()
        .fromTo(toast, { autoAlpha: 0, y: REDUCE ? 0 : -14 },
          { autoAlpha: 1, y: 0, duration: REDUCE ? 0.2 : 0.4, ease: 'back.out(1.7)' })
        .to(toast, { autoAlpha: 0, y: REDUCE ? 0 : -10, duration: 0.4, ease: 'power2.in' }, '+=2.4');
      if (isErr) shake();
    }
    window.alert = function (m) { vxToast(m); };

    var shaking = false;
    function shake() {
      if (REDUCE || shaking) return;
      shaking = true;
      card.classList.add('vx-introing');
      gsap.to(card, {
        keyframes: [{ x: -8 }, { x: 7 }, { x: -6 }, { x: 4 }, { x: 0 }],
        duration: 0.45, ease: 'power1.inOut', clearProps: 'transform',
        onComplete: function () { card.classList.remove('vx-introing'); shaking = false; }
      });
    }

    gsap.matchMedia().add({
      full: '(prefers-reduced-motion: no-preference)',
      reduce: '(prefers-reduced-motion: reduce)'
    }, function (ctx) {
      if (ctx.conditions.reduce) { gsap.set(card, { autoAlpha: 1 }); return; }
      card.classList.add('vx-introing');
      var bits = gsap.utils.toArray('.banner-text > *, .banner');
      var fields = gsap.utils.toArray('#loginForm .input-group, #loginForm .user-id-display');
      var submit = card.querySelector('button[type="submit"]');
      var tl = gsap.timeline({
        defaults: { ease: 'expo.out' },
        onComplete: function () { card.classList.remove('vx-introing'); }
      });
      tl.from(card, { autoAlpha: 0, y: 26, scale: 0.97, duration: 0.7, clearProps: 'transform' })
        .from(bits, { autoAlpha: 0, y: 12, stagger: 0.06, duration: 0.5, clearProps: 'transform' }, '-=0.4')
        .from(fields, { autoAlpha: 0, y: 14, stagger: 0.08, duration: 0.5, clearProps: 'transform' }, '-=0.3')
        .from(submit, { autoAlpha: 0, y: 12, duration: 0.5, clearProps: 'transform' }, '-=0.25');
      return function () { tl.kill(); card.classList.remove('vx-introing'); };
    });

    // 区服选择卡片出现时逐张滑入
    var regionPanel = document.getElementById('regionPanel');
    if (regionPanel) {
      new MutationObserver(function () {
        if (regionPanel.style.display !== 'none' && !regionPanel.__shown) {
          regionPanel.__shown = true;
          if (REDUCE) return;
          var cards = regionPanel.querySelectorAll('.region-card');
          card.classList.add('vx-introing');
          gsap.from(cards, {
            autoAlpha: 0, y: 16, scale: 0.97, stagger: 0.08, duration: 0.5, ease: 'power3.out',
            clearProps: 'transform',
            onComplete: function () { card.classList.remove('vx-introing'); }
          });
        }
      }).observe(regionPanel, { attributes: true, attributeFilter: ['style'] });
    }
  }
  if (window.gsap) vxInit();
  else window.addEventListener('gsapready', vxInit, { once: true });
</script>
</body>
</html>
